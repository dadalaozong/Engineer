{% extends "base.html" %}
{% block title %}图像处理{% endblock %}
{% block page_title %}图像处理{% endblock %}
{% block content %}

<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
  <div class="card">
    <div class="section-title">处理设置</div>
    <div class="form-group">
      <label class="form-label">处理操作</label>
      <select class="form-control" id="op-sel">
        {% for key, label in operations %}
        <option value="{{ key }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">上传图片</label>
      <input class="form-control" type="file" id="img-file" accept="image/*">
    </div>
    <div id="src-preview" style="margin:8px 0"></div>
    <button class="btn btn-primary" style="width:100%" onclick="processImage()">🖼 开始处理</button>
    <div id="proc-status" style="margin-top:8px;font-size:12px"></div>
  </div>

  <div class="card">
    <div class="section-title">处理结果</div>
    <div id="result-area" style="color:#64748b;min-height:200px;display:flex;align-items:center;justify-content:center">
      处理结果将显示在此处
    </div>
    <div id="download-area"></div>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script>
document.getElementById("img-file").addEventListener("change", function() {
  const file = this.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById("src-preview").innerHTML =
      `<img src="${e.target.result}" style="max-width:100%;max-height:180px;border-radius:6px">`;
  };
  reader.readAsDataURL(file);
});

function processImage() {
  const file = document.getElementById("img-file").files[0];
  if (!file) { alert("请先选择图片"); return; }
  const op = document.getElementById("op-sel").value;
  const fd = new FormData();
  fd.append("file", file);
  fd.append("op", op);
  const stat = document.getElementById("proc-status");
  stat.innerHTML = '<span class="spinner"></span> 处理中...';
  fetch("/img/process", {method:"POST", body:fd})
    .then(r => r.json()).then(d => {
      stat.textContent = "";
      if (d.error) {
        stat.innerHTML = `<span style="color:#dc2626">❌ ${d.error}</span>`;
        return;
      }
      document.getElementById("result-area").innerHTML =
        `<img src="${d.image}" style="max-width:100%;max-height:400px;border-radius:6px">`;
      document.getElementById("download-area").innerHTML =
        `<a href="${d.image}" download="result.jpg" class="btn btn-outline btn-sm" style="margin-top:8px">⬇ 下载</a>`;
    }).catch(e => { stat.innerHTML = `<span style="color:#dc2626">❌ ${e.message}</span>`; });
}
</script>
{% endblock %}
