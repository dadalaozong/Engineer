{% extends "base.html" %}
{% block title %}系统设置{% endblock %}
{% block page_title %}系统设置{% endblock %}
{% block content %}

<div style="max-width:700px;display:flex;flex-direction:column;gap:20px">

  <!-- Website Account -->
  <div class="card">
    <div class="section-title">📡 申报网站账号</div>
    <div class="alert alert-info" style="margin-bottom:12px;font-size:12px">
      用于自动登录广西职称申报系统（gxrczc.com），密码加密存储。
    </div>
    <form method="post" action="{{ url_for('settings.save_website') }}">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input class="form-control" name="username"
                 value="{{ cfg.get('website',{}).get('username','') }}"
                 placeholder="手机号或用户名">
        </div>
        <div class="form-group">
          <label class="form-label">密码（留空则不修改）</label>
          <input class="form-control" name="password" type="password" placeholder="重新输入则覆盖">
        </div>
      </div>
      <div style="text-align:right">
        <button class="btn btn-primary" type="submit">💾 保存账号</button>
      </div>
    </form>
  </div>

  <!-- AI Settings -->
  <div class="card">
    <div class="section-title">✨ AI 配置（DeepSeek）</div>
    <form method="post" action="{{ url_for('settings.save_ai') }}">
      <div class="form-group">
        <label class="form-label">API Key（留空则不修改）</label>
        <input class="form-control" name="api_key" type="password" placeholder="sk-...">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">模型</label>
          <input class="form-control" name="model"
                 value="{{ cfg.get('ai',{}).get('model','deepseek-chat') }}">
        </div>
        <div class="form-group">
          <label class="form-label">Base URL</label>
          <input class="form-control" name="base_url"
                 value="{{ cfg.get('ai',{}).get('base_url','https://api.deepseek.com') }}">
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px">
        <button class="btn btn-outline" type="button" onclick="testAI()">🔌 测试连接</button>
        <button class="btn btn-primary" type="submit">💾 保存AI配置</button>
      </div>
      <div id="test-result" style="margin-top:8px;font-size:12px"></div>
    </form>
  </div>

  <!-- Image API -->
  <div class="card">
    <div class="section-title">🖼 图像API配置</div>
    <form method="post" action="{{ url_for('settings.save_image_api') }}">
      <div class="form-group">
        <label class="form-label">Remove.bg API Key（背景移除）</label>
        <input class="form-control" name="remove_bg_key" type="password" placeholder="留空则不修改">
      </div>
      <div class="form-group">
        <label class="form-label">Clipdrop API Key（图像超分）</label>
        <input class="form-control" name="clipdrop_key" type="password" placeholder="留空则不修改">
      </div>
      <div class="form-group">
        <label class="form-label">阿里云 API Key（图像增强）</label>
        <input class="form-control" name="aliyun_key" type="password" placeholder="留空则不修改">
      </div>
      <div style="text-align:right">
        <button class="btn btn-primary" type="submit">💾 保存图像API</button>
      </div>
    </form>
  </div>

</div>

{% endblock %}
{% block scripts %}
<script>
function testAI() {
  const el = document.getElementById("test-result");
  el.innerHTML = '<span class="spinner"></span> 测试中...';
  fetch("{{ url_for('settings.test_ai') }}", {method:"POST"})
    .then(r => r.json()).then(d => {
      el.innerHTML = d.ok
        ? `<span style="color:#16a34a">✅ 连接成功：${d.msg}</span>`
        : `<span style="color:#dc2626">❌ 失败：${d.msg}</span>`;
    });
}
</script>
{% endblock %}
