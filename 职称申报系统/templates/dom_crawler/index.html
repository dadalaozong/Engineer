{% extends "base.html" %}
{% block title %}DOM抓取{% endblock %}
{% block page_title %}DOM抓取 — 表单选择器探测{% endblock %}
{% block content %}

<div style="display:grid;grid-template-columns:360px 1fr;gap:20px;height:calc(100vh - 140px)">

  <!-- Left config panel -->
  <div style="display:flex;flex-direction:column;gap:14px;overflow-y:auto">
    <div class="card">
      <div class="section-title">登录配置</div>
      <div class="form-group">
        <label class="form-label">账号（身份证号）</label>
        <input type="text" class="form-control" id="inp-username"
               value="{{ username }}" placeholder="请输入账号">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-control" id="inp-password" placeholder="请输入密码">
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
          <input type="checkbox" id="chk-headless" checked> 无头模式（后台运行，不显示浏览器）
        </label>
      </div>
    </div>

    <button class="btn btn-primary" style="height:40px" id="btn-start" onclick="startCrawl()">
      ▶ 开始抓取
    </button>

    <div class="progress-wrap"><div class="progress-bar" id="crawl-progress" style="width:0%"></div></div>

    <div class="card" id="result-section" style="display:none">
      <div class="section-title">抓取结果</div>
      <p style="font-size:13px;color:#64748b;margin-bottom:12px">
        抓取完成后可查看字段映射表，以及下载完整的 dom_structure.json。
      </p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn btn-outline" onclick="showMapping()">🗂 查看字段映射</button>
        <button class="btn btn-outline" onclick="downloadResult()">⬇ 下载 dom_structure.json</button>
      </div>
    </div>
  </div>

  <!-- Right log + mapping panel -->
  <div style="display:flex;flex-direction:column;gap:16px;overflow:hidden">
    <div class="card" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div class="section-title" style="margin:0">抓取日志</div>
        <button class="btn btn-sm btn-outline" style="margin-left:auto" onclick="clearLog()">清空</button>
      </div>
      <div id="crawl-log" class="log-terminal" style="flex:1"></div>
    </div>

    <div class="card" id="mapping-card" style="display:none;overflow:auto;max-height:400px">
      <div class="section-title">字段映射表</div>
      <div style="overflow-x:auto">
        <table class="table" id="mapping-table">
          <thead>
            <tr>
              <th>Tab名称</th>
              <th>数据库字段</th>
              <th>网站标签</th>
              <th>选择器</th>
            </tr>
          </thead>
          <tbody id="mapping-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

{% endblock %}
{% block scripts %}
<script>
let running = false;
let stepCount = 0;
const TOTAL_STEPS = 20;

function logLine(text, color) {
  const log = document.getElementById("crawl-log");
  const span = document.createElement("span");
  span.style.color = color || "#e2e8f0";
  span.textContent = text + "\n";
  log.appendChild(span);
  log.scrollTop = log.scrollHeight;
}

function clearLog() {
  document.getElementById("crawl-log").innerHTML = "";
  document.getElementById("crawl-progress").style.width = "0%";
  stepCount = 0;
}

function startCrawl() {
  if (running) return;
  const username = document.getElementById("inp-username").value.trim();
  const password = document.getElementById("inp-password").value;
  if (!username || !password) {
    alert("请填写账号和密码");
    return;
  }

  running = true;
  document.getElementById("btn-start").disabled = true;
  document.getElementById("result-section").style.display = "none";
  document.getElementById("mapping-card").style.display = "none";
  clearLog();

  logLine("═".repeat(50));
  logLine("▶ 开始DOM抓取");
  logLine("═".repeat(50));

  const headless = document.getElementById("chk-headless").checked;
  const form = new FormData();
  form.append("username", username);
  form.append("password", password);
  form.append("headless", headless ? "true" : "false");

  fetch("/dom-crawler/run", {method: "POST", body: form})
    .then(resp => {
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();

      function pump() {
        return reader.read().then(({done, value}) => {
          if (done) { onDone(); return; }
          const text = decoder.decode(value);
          text.split("\n").forEach(line => {
            if (!line.startsWith("data: ")) return;
            const raw = line.slice(6).trim();
            try {
              const d = JSON.parse(raw);
              const colorMap = {
                ok: "#4ade80",
                warn: "#fbbf24",
                info: "#94a3b8",
                error: "#f87171",
                done: "#4ade80",
              };
              logLine(d.msg, colorMap[d.level] || "#e2e8f0");
              stepCount++;
              document.getElementById("crawl-progress").style.width =
                Math.min(stepCount / TOTAL_STEPS * 100, 95) + "%";
              if (d.level === "done") {
                onDone();
              }
            } catch(e) {}
          });
          return pump();
        });
      }
      return pump();
    })
    .catch(e => {
      logLine("❌ " + e.message, "#f87171");
      onDone();
    });
}

function onDone() {
  running = false;
  document.getElementById("btn-start").disabled = false;
  document.getElementById("crawl-progress").style.width = "100%";
  document.getElementById("result-section").style.display = "block";
  logLine("═".repeat(50));
  logLine("✅ 抓取结束，可在左侧查看结果或下载JSON", "#4ade80");
  logLine("═".repeat(50));
  setTimeout(() => {
    document.getElementById("crawl-progress").style.width = "0%";
  }, 3000);
}

function showMapping() {
  fetch("/dom-crawler/result")
    .then(r => r.json())
    .then(res => {
      if (!res.ok) {
        alert(res.error || "暂无结果");
        return;
      }
      const data = res.data;
      const tbody = document.getElementById("mapping-tbody");
      tbody.innerHTML = "";

      const mapping = data.field_mapping || {};
      const entries = Object.entries(mapping);
      if (entries.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#94a3b8">暂无字段映射数据</td></tr>';
      } else {
        entries.forEach(([dbField, info]) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${info.tab || "—"}</td>
            <td><code>${dbField}</code></td>
            <td>${info.label || "—"}</td>
            <td><code>${info.selector || "—"}</code></td>
          `;
          tbody.appendChild(tr);
        });
      }
      document.getElementById("mapping-card").style.display = "block";
      document.getElementById("mapping-card").scrollIntoView({behavior: "smooth"});
    })
    .catch(e => alert("加载失败: " + e.message));
}

function downloadResult() {
  fetch("/dom-crawler/result")
    .then(r => r.json())
    .then(res => {
      if (!res.ok) { alert(res.error || "暂无结果"); return; }
      const blob = new Blob([JSON.stringify(res.data, null, 2)], {type: "application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "dom_structure.json";
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    })
    .catch(e => alert("下载失败: " + e.message));
}
</script>
{% endblock %}
