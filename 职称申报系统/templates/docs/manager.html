{% extends "base.html" %}
{% block title %}材料目录{% endblock %}
{% block page_title %}材料目录管理{% endblock %}
{% block content %}

<div style="display:grid;grid-template-columns:300px 1fr;gap:20px">
  <div>
    <div class="card" style="margin-bottom:16px">
      <div class="section-title">查看材料清单</div>
      <div class="form-group">
        <label class="form-label">申报级别</label>
        <select class="form-control" id="level-sel" onchange="loadMaterials()">
          <option value="">请选择</option>
          {% for lvl in levels %}
          <option value="{{ lvl }}">{{ lvl }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="card">
      <div class="section-title">新建材料文件夹</div>
      <div class="form-group"><label class="form-label">基础目录</label>
        <input class="form-control" id="base-dir" placeholder="如：D:\职称材料"></div>
      <div class="form-group"><label class="form-label">姓名</label>
        <input class="form-control" id="folder-name"></div>
      <div class="form-group"><label class="form-label">级别</label>
        <select class="form-control" id="folder-level">
          <option value="">请选择</option>
          {% for lvl in levels %}
          <option value="{{ lvl }}">{{ lvl }}</option>
          {% endfor %}
        </select>
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="buildFolder()">📁 创建文件夹结构</button>
      <div id="build-result" style="margin-top:8px;font-size:12px"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">材料清单</div>
    <div id="materials-area" style="color:#64748b;padding:20px 0">请选择申报级别查看清单</div>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script>
function loadMaterials() {
  const level = document.getElementById("level-sel").value;
  if (!level) return;
  fetch(`/docs/materials?level=${encodeURIComponent(level)}`)
    .then(r => r.json()).then(mats => {
      const area = document.getElementById("materials-area");
      if (!mats.length) { area.innerHTML = "<p>暂无清单定义</p>"; return; }
      const rows = mats.map((m, i) => {
        const name = typeof m === "string" ? m : m.name;
        const req  = typeof m === "object" ? m.required : true;
        return `<tr><td>${i+1}</td><td>${name}</td>
          <td>${req ? '<span class="badge badge-red">必须</span>' : '<span class="badge badge-gray">可选</span>'}</td></tr>`;
      }).join("");
      area.innerHTML = `<table><thead><tr><th>#</th><th>材料名称</th><th>要求</th></tr></thead>
        <tbody>${rows}</tbody></table>`;
    });
}
function buildFolder() {
  const data = {
    base_dir: document.getElementById("base-dir").value,
    name:     document.getElementById("folder-name").value,
    level:    document.getElementById("folder-level").value,
  };
  fetch("/docs/build", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(data)
  }).then(r => r.json()).then(d => {
    const el = document.getElementById("build-result");
    if (d.ok) el.innerHTML = `<span style="color:#16a34a">✓ 已创建：${d.path}</span>`;
    else el.innerHTML = `<span style="color:#dc2626">✗ ${d.error}</span>`;
  });
}
</script>
{% endblock %}
